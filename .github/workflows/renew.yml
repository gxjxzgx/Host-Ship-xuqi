name: Host-Ship Auto Renew

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 08:00 自动检查
    # GitHub cron 使用 UTC
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"

permissions:
  contents: read
  actions: write   # 用于清理旧的运行记录

# 防止手动运行和定时任务同时跑，重复点续期
concurrency:
  group: hostship-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Setup optional VLESS/VMess/Trojan node
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            echo "NODE_LINK detected, setting up local proxy..."

            bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

          else
            echo "IS_PROXY=false" >> "$GITHUB_ENV"
            echo "No NODE_LINK, direct connection will be used."
          fi

      - name: Run renew
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          HOSTSHIP_LOGIN: ${{ secrets.HOSTSHIP_LOGIN }}
          HOSTSHIP_PASSWORD: ${{ secrets.HOSTSHIP_PASSWORD }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}

          # 多台服务器之间的间隔（秒）
          SERVER_INTERVAL: "5"

          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}

        run: python hostship_renew.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hostship-debug-screenshots
          path: |
            hostship_*.png
          if-no-files-found: ignore

      - name: Cleanup proxy
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log || true

      - name: Cleanup old workflow runs (keep latest 3)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 按时间从新到旧列出本工作流所有运行，跳过最新 3 条（含当前这次），其余已完成的删除
          gh api --paginate \
            "repos/${{ github.repository }}/actions/workflows/renew.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | "\(.id) \(.status)"' \
            | tail -n +4 \
            | awk '$2 == "completed" {print $1}' \
            | while read -r id; do
                echo "Deleting run $id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
              done
